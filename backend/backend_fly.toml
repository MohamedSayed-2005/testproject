app = "signal-viewer-api"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  CORS_ORIGINS = "*"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512